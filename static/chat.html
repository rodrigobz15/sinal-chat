<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2isPair — converse com um estranho</title>
<style>
  :root{
    --bg: #0b0d10;
    --panel: #12161b;
    --line: #1f262e;
    --text: #e7ecf0;
    --dim: #7a8794;
    --accent: #5eead4;    /* 2isPair / conectado */
    --accent-2: #a78bfa;  /* procurando */
    --danger: #f87171;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body[data-theme="light"]{
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e2e6ea;
    --text: #14181c;
    --dim: #6b7680;
  }

  .theme-toggle{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .theme-toggle:hover{ border-color: var(--dim); }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--dim);
    transition: background .3s, box-shadow .3s;
  }
  .dot.searching{ background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); animation: pulse 1.2s infinite; }
  .dot.connected{ background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(1.4); }
  }

  .status-text{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 1px;
    background: var(--line);
    min-height:0;
  }

  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
  }

  .video-stage{
    background: var(--bg);
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    min-height:0;
  }

  .video-grid{
    flex:1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    min-height: 0;
  }

  .video-box{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    aspect-ratio: 1 / 1;
  }

  video{
    width:100%;
    height:100%;
    object-fit: cover;
    background: #000;
  }

  .video-label{
    position:absolute;
    bottom: 10px;
    left: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    background: rgba(0,0,0,0.5);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .placeholder{
    font-family: var(--mono);
    color: var(--dim);
    font-size: 13px;
    text-align:center;
    padding: 20px;
  }

  .controls{
    display:flex;
    gap: 10px;
  }

  button{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s, transform .1s;
  }
  button:hover{ border-color: var(--dim); }
  button:active{ transform: scale(0.97); }

  button.primary{
    background: var(--accent);
    color: #0b0d10;
    border-color: var(--accent);
  }
  button.primary:hover{ filter: brightness(1.08); }

  button.next{
    background: var(--accent-2);
    color: #0b0d10;
    border-color: var(--accent-2);
  }

  button:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  .chat-panel{
    background: var(--bg);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .chat-log{
    flex:1;
    overflow-y:auto;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .msg{
    font-size: 14px;
    line-height: 1.4;
    max-width: 85%;
    padding: 9px 13px;
    border-radius: 10px;
  }
  .msg.me{
    align-self:flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .msg.stranger{
    align-self:flex-start;
    background: rgba(94,234,212,0.08);
    border: 1px solid rgba(94,234,212,0.25);
  }
  .msg.system{
    align-self:center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    text-transform:uppercase;
    letter-spacing: 0.05em;
    background:none;
    border:none;
    padding: 4px;
  }

  .chat-input-row{
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    display:flex;
    gap: 10px;
  }

  .chat-input-row input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }
  .chat-input-row input:focus{ outline:none; border-color: var(--accent); }
  .chat-input-row input:disabled{ opacity:0.5; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  /* Modo somente texto: some só com o grid de vídeo, mantém os controles */
  body.text-mode .video-grid{ display:none; }
  body.text-mode .video-stage{ max-width: 720px; margin: 0 auto; width:100%; }
  body.text-mode main{ grid-template-columns: 1fr; }
  body.text-mode .chat-panel{ max-width: 720px; margin: 0 auto; width:100%; }

  .back-link{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    text-decoration:none;
  }
  .back-link:hover{ color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="statusDot"></span>
    2isPair
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div class="status-text" id="statusText">desconectado</div>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">☀️</button>
    <a class="back-link" href="/" id="leaveLink">← sair</a>
  </div>
</header>

<main>
  <div class="video-stage">
    <div class="video-grid">
      <div class="video-box">
        <video id="localVideo" autoplay muted playsinline></video>
        <span class="video-label">você</span>
      </div>
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="placeholder" id="remotePlaceholder">aguardando um estranho...</span>
        <span class="video-label" id="remoteLabel" style="display:none;">estranho</span>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="startBtn">começar</button>
      <button class="next" id="nextBtn" disabled>próximo →</button>
      <button id="stopBtn" disabled>parar</button>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="diga oi..." disabled>
      <button class="primary" id="sendBtn" disabled>enviar</button>
    </div>
  </div>
</main>

<script>
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const remotePlaceholder = document.getElementById('remotePlaceholder');
const remoteLabel = document.getElementById('remoteLabel');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const stopBtn = document.getElementById('stopBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// STUN público do Google — funciona para boa parte das conexões.
// Para produção de verdade, adicione também um servidor TURN (veja README).
// STUN/TURN dedicados (conta grátis no Metered) — bem mais confiáveis que
// servidores públicos compartilhados, essencial pra conectar entre redes
// diferentes (ex: wifi de um lado e dados móveis do outro).
const ICE_SERVERS = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:443', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
];

async function getIceServers() {
  return ICE_SERVERS;
}

let ws = null;
let pc = null;
let localStream = null;
let role = null; // 'caller' | 'callee'
let connected = false;
let searchWatchdog = null;

function armSearchWatchdog() {
  clearSearchWatchdog();
  // Se ficar "procurando" por tempo demais sem conectar de verdade, tenta se
  // re-parear sozinho — evita ficar preso quando uma mensagem de pareamento
  // se perde (mais comum em redes móveis instáveis).
  searchWatchdog = setTimeout(() => {
    if (!connected && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'next' }));
      armSearchWatchdog();
    }
  }, 7000);
}

function clearSearchWatchdog() {
  if (searchWatchdog) {
    clearTimeout(searchWatchdog);
    searchWatchdog = null;
  }
}

// Manda um "ping" periódico pro servidor — evita que a conexão seja
// derrubada por inatividade (proxies costumam fechar WebSockets ociosos).
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 20000);

// Preferências vindas da landing page via querystring: ?mode=video&country=BR&interests=games,musica
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'text' ? 'text' : 'video';
const COUNTRY = params.get('country') || 'any';
const INTERESTS = (params.get('interests') || '')
  .split(',')
  .map(s => s.trim().toLowerCase())
  .filter(Boolean);

if (MODE === 'text') {
  document.body.classList.add('text-mode');
}

function setStatus(state, label) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = label;
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function start() {
  startBtn.disabled = true;

  if (MODE === 'video') {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
    } catch (err) {
      addMsg('não consegui acessar câmera/microfone: ' + err.message, 'system');
      startBtn.disabled = false;
      return;
    }
  }

  connectSocket();
  stopBtn.disabled = false;
}

function connectSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setStatus('searching', 'procurando estranho...');
    nextBtn.disabled = false;
    ws.send(JSON.stringify({ type: 'join', mode: MODE, country: COUNTRY, interests: INTERESTS }));
  };

  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);

    switch (data.type) {
      case 'waiting':
        setStatus('searching', 'procurando estranho...');
        armSearchWatchdog();
        break;

      case 'matched':
        clearSearchWatchdog();
        // Garante um estado limpo mesmo se alguma mensagem anterior (tipo
        // 'partner-left') tiver se perdido no caminho.
        teardownPeer();
        role = data.role;
        setStatus('connected', 'conectado');
        connected = true;
        nextBtn.disabled = false;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        remotePlaceholder.style.display = 'none';
        remoteLabel.style.display = 'block';
        if (data.shared && data.shared.length) {
          addMsg(`você foi conectado a um estranho. em comum: ${data.shared.join(', ')}`, 'system');
        } else {
          addMsg('você foi conectado a um estranho. diga oi!', 'system');
        }
        if (MODE === 'video') {
          await setupPeerConnection();
          if (role === 'caller') {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
          }
        }
        break;

      case 'offer':
        if (!pc) await setupPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: data.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        break;

      case 'answer':
        await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
        break;

      case 'candidate':
        if (data.candidate) {
          try { await pc.addIceCandidate(data.candidate); } catch (e) {}
        }
        break;

      case 'chat':
        addMsg(data.text, 'stranger');
        break;

      case 'partner-left':
        addMsg('o estranho saiu da conversa.', 'system');
        teardownPeer();
        setStatus('searching', 'procurando outro estranho...');
        armSearchWatchdog();
        break;
    }
  };

  ws.onclose = () => {
    if (connected || startBtn.disabled) {
      setStatus('', 'desconectado');
    }
  };
}

async function setupPeerConnection() {
  const iceServers = await getIceServers();
  pc = new RTCPeerConnection({ iceServers });

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    console.log('ICE state:', state);
    if (state === 'checking') {
      addMsg('conectando o vídeo...', 'system');
    } else if (state === 'connected' || state === 'completed') {
      // silencioso, já dá pra ver o vídeo aparecendo
    } else if (state === 'failed') {
      addMsg('não consegui conectar o vídeo com esse estranho (rede muito restrita). tenta "próximo".', 'system');
    } else if (state === 'disconnected') {
      addMsg('conexão de vídeo instável...', 'system');
    }
  };
}

function teardownPeer() {
  if (pc) {
    pc.close();
    pc = null;
  }
  remoteVideo.srcObject = null;
  remotePlaceholder.style.display = 'block';
  remoteLabel.style.display = 'none';
  connected = false;
  // nextBtn fica de propósito habilitado — é a forma manual de "procurar
  // outra pessoa" caso o re-pareamento automático demore.
  chatInput.disabled = true;
  sendBtn.disabled = true;
}

function next() {
  teardownPeer();
  chatLog.innerHTML = '';
  setStatus('searching', 'procurando outro estranho...');
  ws.send(JSON.stringify({ type: 'next' }));
}

function stop() {
  clearSearchWatchdog();
  teardownPeer();
  if (ws) ws.close();
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localVideo.srcObject = null;
  }
  setStatus('', 'desconectado');
  startBtn.disabled = false;
  stopBtn.disabled = true;
  nextBtn.disabled = true;
  chatLog.innerHTML = '';
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !connected) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  addMsg(text, 'me');
  chatInput.value = '';
}

startBtn.onclick = start;
nextBtn.onclick = next;
stopBtn.onclick = stop;
sendBtn.onclick = sendChat;

document.getElementById('leaveLink').addEventListener('click', (e) => {
  e.preventDefault();
  stop(); // avisa o parceiro (via fechamento do WS) e limpa tudo antes de sair
  setTimeout(() => { location.href = '/'; }, 150);
});

// Tema claro/escuro, salvo pro navegador lembrar na próxima visita
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(localStorage.getItem('theme') || 'dark');
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', next);
  applyTheme(next);
});
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});
</script>
</body>
</html>
