<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2isPair — talk to a stranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fbf9ff;
    --panel: #ffffff;
    --panel-2: #f4f0fc;
    --line: #ece5fa;
    --text: #332f45;
    --dim: #8b84a0;
    --accent-a: #8b6cf7;   /* você — roxo */
    --accent-a-soft: #ece5fd;
    --accent-b: #ff9d72;   /* estranho — pêssego */
    --accent-b-soft: #ffe9dd;
    --display: 'Fredoka', 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 20px;
  }

  body[data-theme="dark"]{
    --bg: #221f30;
    --panel: #2b2740;
    --panel-2: #332e4a;
    --line: #423b5c;
    --text: #f1eefa;
    --dim: #a79fc2;
    --accent-a-soft: #3a3355;
    --accent-b-soft: #4a3a3c;
  }

  .theme-toggle{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    width: 34px; height: 34px;
    display:flex; align-items:center; justify-content:center;
    font-size: 14px;
    cursor: pointer;
  }
  .theme-toggle:hover{ border-color: var(--accent-a); }

  .lang-toggle{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .lang-toggle:hover{ border-color: var(--accent-a); }

  .support-menu{
    position: relative;
  }
  .support-btn{
    background: var(--accent-b-soft);
    border: 1px solid var(--accent-b);
    color: var(--accent-b);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }
  .support-btn:hover{ filter: brightness(0.97); }

  .support-dropdown{
    display: none;
    flex-direction: column;
    gap: 10px;
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 16px 40px -16px rgba(0,0,0,0.3);
    z-index: 30;
    text-align: left;
  }
  .support-dropdown.open{ display: flex; }
  .support-dropdown strong{
    font-family: var(--display);
    font-weight: 600;
    font-size: 14.5px;
  }
  .support-dropdown p{
    margin: 0;
    font-size: 12.5px;
    color: var(--dim);
    font-weight: 600;
    line-height: 1.5;
  }
  .pix-row{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .pix-row code{
    flex: 1;
    font-size: 12px;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pix-row button{
    background: var(--accent-a);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
  }
  .brand-mark{
    width: 28px; height: 28px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand .two{ color: var(--accent-a); }
  .brand .pair{ color: var(--accent-b); }

  .dot{
    width:9px;height:9px;border-radius:50%;
    background: var(--dim);
    transition: background .3s, box-shadow .3s;
    flex-shrink:0;
  }
  .dot.searching{ background: var(--accent-b); box-shadow: 0 0 10px var(--accent-b); animation: pulse 1.2s infinite; }
  .dot.connected{ background: #6bcf7f; box-shadow: 0 0 10px #6bcf7f; }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(1.4); }
  }

  .status-text{
    font-size: 12px;
    color: var(--dim);
    font-weight: 700;
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns: minmax(420px, 620px) 1fr;
    gap: 1px;
    background: var(--line);
    min-height:0;
    transition: grid-template-columns .2s ease;
  }

  /* Quando a sala tem mais de 2 pessoas, abre uma coluna de vídeo no lado
     direito também — câmeras nos dois cantos, chat espremido no meio */
  main.has-right{
    grid-template-columns: minmax(260px, 380px) 1fr minmax(260px, 380px);
  }

  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
    main.has-right{ grid-template-columns: 1fr; }
  }

  .video-side{
    background: var(--bg);
    padding: 12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: 10px;
    min-height:0;
  }

  .video-side-right:empty{
    display:none;
  }

  @media (max-width: 860px){
    .video-side-right{
      flex-direction: row;
      flex-wrap: wrap;
    }
    .video-side-right .video-box{
      width: calc(50% - 5px);
    }
  }

  .video-box{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    width: 100%;
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    box-shadow: 0 10px 26px -16px rgba(139,108,247,0.3);
  }

  video{
    width:100%;
    height:100%;
    object-fit: cover;
    background: #000;
  }

  .video-label{
    position:absolute;
    bottom: 10px;
    left: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .more-menu{
    position: relative;
  }

  .more-menu > button{
    padding: 12px 14px;
    font-size: 18px;
    line-height: 1;
  }

  .more-dropdown{
    display: none;
    flex-direction: column;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    min-width: 200px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 32px -8px rgba(0,0,0,0.25);
    overflow: hidden;
    z-index: 20;
  }

  .more-dropdown.open{
    display: flex;
  }

  .more-dropdown button{
    text-align: left;
    border: none;
    border-radius: 0;
    background: transparent;
    padding: 12px 16px;
    font-size: 14px;
  }

  .more-dropdown button:hover{
    background: var(--panel-2);
    border-color: transparent;
  }

  .placeholder{
    color: var(--dim);
    font-size: 13px;
    font-weight: 600;
    text-align:center;
    padding: 20px;
  }

  .controls{
    display:flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .controls button{
    padding: 12px 16px;
    font-size: 13px;
    white-space: nowrap;
  }

  button{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: var(--radius);
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s, transform .1s, filter .15s;
  }
  button:hover{ border-color: var(--accent-a); }
  button:active{ transform: scale(0.97); }

  button.primary{
    background: var(--accent-a);
    color: #fff;
    border-color: var(--accent-a);
  }
  button.primary:hover{ filter: brightness(1.08); }

  button.next{
    background: var(--accent-b);
    color: #fff;
    border-color: var(--accent-b);
  }

  button:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  .chat-panel{
    background: var(--bg);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .chat-log{
    flex:1;
    overflow-y:auto;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .rules-banner{
    background: var(--accent-a-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 6px;
  }
  .rules-banner strong{
    display: block;
    font-family: var(--display);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .rules-banner ul{
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .rules-banner li{
    font-size: 13px;
    color: var(--dim);
    font-weight: 600;
    line-height: 1.4;
  }

  .msg{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
  }
  .msg.me{
    align-self:flex-end;
    background: var(--accent-a);
    color: #fff;
    border: none;
  }
  .msg.stranger{
    align-self:flex-start;
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .msg.system{
    align-self:center;
    font-size: 12px;
    color: var(--dim);
    background:none;
    border:none;
    padding: 4px;
    text-align: center;
    font-weight: 700;
  }

  .bottom-bar{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  @media (max-width: 640px){
    .bottom-bar{ flex-wrap: wrap; }
  }

  .chat-input-row{
    flex:1;
    display:flex;
    gap: 10px;
    min-width: 200px;
  }

  .chat-input-row input{
    flex:1;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
  }
  .chat-input-row input:focus{ outline:none; border-color: var(--accent-a); }
  .chat-input-row input:disabled{ opacity:0.5; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  /* Modo somente texto: some só com o grid de vídeo, mantém os controles */
  body.text-mode .video-side{ display:none; }
  body.text-mode main{ grid-template-columns: 1fr; }
  body.text-mode .chat-panel{ max-width: 720px; margin: 0 auto; width:100%; }
  body.text-mode .bottom-bar{ max-width: 720px; margin: 0 auto; width:100%; }
  body.text-mode .more-menu{ display:none; }

  .back-link{
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
    text-decoration:none;
  }
  .back-link:hover{ color: var(--accent-a); }
</style>
</head>

<script>
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const localVideo = document.getElementById('localVideo');
const videoLeft = document.getElementById('videoLeft');
const videoRight = document.getElementById('videoRight');
const mainEl = document.querySelector('main');
const waitingBox = document.getElementById('waitingBox');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const stopBtn = document.getElementById('stopBtn');
const screenBtn = document.getElementById('screenBtn');
const flipBtn = document.getElementById('flipBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// ---- Sistema de idiomas: inglês por padrão, com opção de trocar pra português ----
const translations = {
  en: {

    statusSearching: 'searching for a stranger...',

    copyBtn: 'copiar',
    copiedMsg: 'copiado!',
    copyErrorMsg: 'erro :(',
    leaveLink: '← sair',
    waitingPlaceholder: 'aguardando um estranho...',
    youLabel: 'você',
    strangerLabel: 'estranho',
    startBtn: 'começar',
    nextBtn: 'próximo →',
    stopBtn: 'parar',
    flipBtn: '🔄 Trocar câmera',
    shareBtn: '🖥️ Compartilhar tela',
    stopShareBtn: '🖥️ Parar compartilhamento',

    cameraError: 'não consegui acessar câmera/microfone: ',

    partnerLeft: 'o estranho saiu da conversa.',

  }
};

function getLang() {
  return localStorage.getItem('lang') || 'en';
}
function t(key, vars) {
  const dict = translations[getLang()] || translations.en;
  let str = dict[key] !== undefined ? dict[key] : (translations.en[key] || key);
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.replace(`{${k}}`, vars[k]); });
  }
  return str;
}

// STUN/TURN dedicados (conta grátis no Metered) — bem mais confiáveis que
// servidores públicos compartilhados, essencial pra conectar entre redes
// diferentes (ex: wifi de um lado e dados móveis do outro).
const ICE_SERVERS = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:443', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
];

async function getIceServers() {
  return ICE_SERVERS;
}

let ws = null;
let localStream = null;
let myId = null;
// Cada pessoa da sala tem sua própria conexão WebRTC direta (malha P2P).
// Chave: id do peer remoto. Valor: { pc, videoEl }
const peers = new Map();
let connected = false;
let searchWatchdog = null;
let currentFacingMode = 'user'; // 'user' = frontal, 'environment' = traseira
let sharingScreen = false;
let cameraTrackBackup = null;

function armSearchWatchdog() {
  clearSearchWatchdog();
  // Se ficar "procurando" por tempo demais sem conectar de verdade, tenta se
  // re-parear sozinho — evita ficar preso quando uma mensagem de pareamento
  // se perde (mais comum em redes móveis instáveis).
  searchWatchdog = setTimeout(() => {
    if (!connected && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'next' }));
      armSearchWatchdog();
    }
  }, 7000);
}

function clearSearchWatchdog() {
  if (searchWatchdog) {
    clearTimeout(searchWatchdog);
    searchWatchdog = null;
  }
}

// Manda um "ping" periódico pro servidor — evita que a conexão seja
// derrubada por inatividade (proxies costumam fechar WebSockets ociosos).
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 20000);

// Preferências vindas da landing page via querystring:
// ?mode=video&country=BR&interests=games,musica&size=2
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'text' ? 'text' : 'video';
const COUNTRY = params.get('country') || 'any';
const INTERESTS = (params.get('interests') || '')
  .split(',')
  .map(s => s.trim().toLowerCase())
  .filter(Boolean);
const GROUP_SIZE = Math.max(2, Math.min(4, parseInt(params.get('size'), 10) || 2));

if (MODE === 'text') {
  document.body.classList.add('text-mode');
}

function setStatus(state, label) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = label;
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function start() {
  startBtn.disabled = true;

  if (MODE === 'video') {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
      localVideo.srcObject = localStream;
      screenBtn.disabled = false;
    } catch (err) {
      addMsg(t('cameraError') + err.message, 'system');
      startBtn.disabled = false;
      return;
    }
  }

  connectSocket();
  stopBtn.disabled = false;
}

function connectSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setStatus('searching', t('statusSearching'));
    nextBtn.disabled = false;
    ws.send(JSON.stringify({
      type: 'join', mode: MODE, country: COUNTRY, interests: INTERESTS, group_size: GROUP_SIZE
    }));
  };

  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);

    switch (data.type) {
      case 'waiting':
        setStatus('searching', t('statusSearching'));
        armSearchWatchdog();
        break;

      case 'room-ready':
        clearSearchWatchdog();
        teardownPeers(); // garante estado limpo, mesmo se algo anterior se perdeu
        myId = data.you;
        setStatus('connected', t('statusConnected'));
        connected = true;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        waitingBox.style.display = 'none';

        const n = data.peers.length;
        addMsg(n === 1 ? t('connectedOne') : t('connectedMany', { n }), 'system');

        if (MODE === 'video') {
          for (const otherId of data.peers) {
            const isCaller = myId < otherId; // regra determinística: quem tem id "menor" inicia a oferta
            await setupPeerConnection(otherId, isCaller);
          }
        }
        break;

      case 'offer': {
        let entry = peers.get(data.from);
        if (!entry) entry = await setupPeerConnection(data.from, false);
        await entry.pc.setRemoteDescription({ type: 'offer', sdp: data.sdp });
        const answer = await entry.pc.createAnswer();
        await entry.pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', to: data.from, sdp: answer.sdp }));
        break;
      }

      case 'answer': {
        const entry = peers.get(data.from);
        if (entry) await entry.pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
        break;
      }

      case 'candidate': {
        const entry = peers.get(data.from);
        if (entry && data.candidate) {
          try { await entry.pc.addIceCandidate(data.candidate); } catch (e) {}
        }
        break;
      }

      case 'chat':
        addMsg(data.text, 'stranger');
        break;

      case 'partner-left':
        // Isso só acontece no chat normal (1 estranho) — a conversa acabou
        // de verdade, então volta a procurar do zero.
        addMsg(t('partnerLeft'), 'system');
        teardownPeers();
        setStatus('searching', t('statusSearchingOther'));
        armSearchWatchdog();
        break;

      case 'peer-joined':
        // Alguém novo entrou na sala de grupo — a conexão com essa pessoa
        // vai se formar sozinha assim que a oferta dela chegar (não precisa
        // fazer nada aqui além de avisar na tela).
        addMsg(t('peerJoined'), 'system');
        break;

      case 'peer-left':
        // Só essa pessoa saiu — a sala continua rodando pra quem ficou.
        addMsg(t('peerLeft'), 'system');
        removePeerBox(data.peer_id);
        break;
    }
  };

  ws.onclose = () => {
    if (connected || startBtn.disabled) {
      setStatus('', t('statusDisconnected'));
    }
  };
}

function createRemoteVideoBox(peerId) {
  // Se por algum motivo já existe uma caixa desse peerId (reconexão rápida,
  // evento duplicado etc), remove a antiga antes de criar a nova — nunca
  // deixa fantasma acumulado.
  const stale = document.querySelector(`[data-peer-id="${peerId}"]`);
  if (stale) stale.remove();

  const box = document.createElement('div');
  box.className = 'video-box';
  box.dataset.peerId = peerId;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;

  const label = document.createElement('span');
  label.className = 'video-label';
  label.textContent = t('strangerLabel');

  box.appendChild(video);
  box.appendChild(label);

  // O primeiro estranho fica do lado esquerdo (em cima da sua câmera); do
  // segundo em diante vai pro lado direito — assim fica "2 de um lado, 2 do
  // outro", com o estranho sempre por cima de você (igual Omegle).
  const localBox = document.getElementById('localBox');
  const existingRemotes = document.querySelectorAll('[data-peer-id]').length;
  if (existingRemotes === 0) {
    waitingBox.style.display = 'none';
    videoLeft.insertBefore(box, localBox);
  } else {
    videoRight.appendChild(box);
  }
  updateLayout();
  return video;
}

function updateLayout() {
  mainEl.classList.toggle('has-right', videoRight.childElementCount > 0);
}

async function setupPeerConnection(peerId, isCaller) {
  // Idem: se já existe uma conexão pra esse peerId (reconexão rápida,
  // mensagem duplicada), fecha a antiga antes de abrir uma nova.
  const existing = peers.get(peerId);
  if (existing) {
    existing.pc.close();
    peers.delete(peerId);
  }

  const iceServers = await getIceServers();
  const pc = new RTCPeerConnection({ iceServers });
  const videoEl = MODE === 'video' ? createRemoteVideoBox(peerId) : null;

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.ontrack = (event) => {
    if (videoEl) videoEl.srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({ type: 'candidate', to: peerId, candidate: event.candidate }));
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    if (state === 'failed') {
      addMsg(t('videoFailedMsg'), 'system');
    }
  };

  peers.set(peerId, { pc, videoEl });

  if (isCaller) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', to: peerId, sdp: offer.sdp }));
  }

  return peers.get(peerId);
}

function teardownPeers() {
  peers.forEach(({ pc }) => pc.close());
  peers.clear();
  document.querySelectorAll('[data-peer-id]').forEach(el => el.remove());
  waitingBox.style.display = 'flex';
  updateLayout();
  connected = false;
  chatInput.disabled = true;
  sendBtn.disabled = true;
}

function removePeerBox(peerId) {
  const entry = peers.get(peerId);
  if (entry) {
    entry.pc.close();
    peers.delete(peerId);
  }
  const box = document.querySelector(`[data-peer-id="${peerId}"]`);
  if (box) box.remove();

  // Se ninguém mais restou na sala, volta a mostrar o placeholder — mas
  // continua "conectado" (a sala de grupo continua aberta, só esperando
  // mais gente entrar).
  if (document.querySelectorAll('[data-peer-id]').length === 0) {
    waitingBox.style.display = 'flex';
  }
  updateLayout();
}

function resetChatLog() {
  chatLog.innerHTML = `
    <div class="rules-banner">
      <strong>${t('rulesTitle')}</strong>
      <ul>
        <li>${t('rule1')}</li>
        <li>${t('rule2')}</li>
        <li>${t('rule3')}</li>
        <li>${t('rule4')}</li>
      </ul>
    </div>`;
}

function next() {
  teardownPeers();
  if (sharingScreen) {
    sharingScreen = false;
    screenBtn.textContent = t('shareBtn');
    localVideo.srcObject = localStream;
  }
  resetChatLog();
  setStatus('searching', t('statusSearchingOther'));
  ws.send(JSON.stringify({ type: 'next' }));
}

function stop() {
  clearSearchWatchdog();
  teardownPeers();
  if (ws) ws.close();
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localVideo.srcObject = null;
  }
  sharingScreen = false;
  cameraTrackBackup = null;
  screenBtn.disabled = true;
  screenBtn.textContent = t('shareBtn');
  setStatus('', t('statusDisconnected'));
  startBtn.disabled = false;
  stopBtn.disabled = true;
  nextBtn.disabled = true;
  resetChatLog();
}

async function flipCamera() {
  if (!localStream) return;
  const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: nextFacing }, audio: false });
    const newTrack = newStream.getVideoTracks()[0];

    // Troca a faixa de vídeo enviada pra TODOS os participantes da sala
    peers.forEach(({ pc }) => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(newTrack);
    });

    const oldTrack = localStream.getVideoTracks()[0];
    if (oldTrack) {
      localStream.removeTrack(oldTrack);
      oldTrack.stop();
    }
    localStream.addTrack(newTrack);
    localVideo.srcObject = localStream;
    currentFacingMode = nextFacing;
  } catch (err) {
    addMsg(t('flipError') + err.message, 'system');
  }
}

async function toggleScreenShare() {
  if (!sharingScreen) {
    try {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      cameraTrackBackup = localStream ? localStream.getVideoTracks()[0] : null;

      peers.forEach(({ pc }) => {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenTrack);
      });

      localVideo.srcObject = screenStream;
      sharingScreen = true;
      screenBtn.textContent = t('stopShareBtn');
      screenTrack.onended = () => stopScreenShare();
    } catch (err) {
      // Usuário cancelou o seletor de tela — não é um erro de verdade
    }
  } else {
    stopScreenShare();
  }
}

async function stopScreenShare() {
  if (!sharingScreen) return;
  if (cameraTrackBackup) {
    peers.forEach(({ pc }) => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(cameraTrackBackup);
    });
  }
  localVideo.srcObject = localStream;
  sharingScreen = false;
  screenBtn.textContent = t('shareBtn');
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !connected) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  addMsg(text, 'me');
  chatInput.value = '';
}

startBtn.onclick = start;
nextBtn.onclick = next;
stopBtn.onclick = stop;
sendBtn.onclick = sendChat;

const moreBtn = document.getElementById('moreBtn');
const moreDropdown = document.getElementById('moreDropdown');

moreBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  moreDropdown.classList.toggle('open');
});
document.addEventListener('click', () => {
  moreDropdown.classList.remove('open');
});
moreDropdown.addEventListener('click', (e) => e.stopPropagation());

flipBtn.onclick = () => {
  moreDropdown.classList.remove('open');
  flipCamera();
};
screenBtn.onclick = () => {
  moreDropdown.classList.remove('open');
  toggleScreenShare();
};

document.getElementById('leaveLink').addEventListener('click', (e) => {
  e.preventDefault();
  stop(); // avisa a sala (via fechamento do WS) e limpa tudo antes de sair
  setTimeout(() => { location.href = '/'; }, 150);
});

// Tema claro/escuro — claro é o padrão agora
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'light' ? '🌙' : '☀️';
}
applyTheme(localStorage.getItem('theme') || 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', next);
  applyTheme(next);
});
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

// Idioma — inglês por padrão, com opção de trocar pra português
function applyLanguage(lang) {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.getElementById('moreBtn').title = t('moreOptionsTitle');
  document.getElementById('langToggle').textContent = lang === 'en' ? '🇧🇷 PT' : '🇺🇸 EN';
  if (!connected && !ws) {
    statusText.textContent = t('statusDisconnected');
  }
  resetChatLog();
}
applyLanguage(getLang());
document.getElementById('langToggle').addEventListener('click', () => {
  const next = getLang() === 'en' ? 'pt' : 'en';
  localStorage.setItem('lang', next);
  applyLanguage(next);
});

// Botão de apoio (Pix)
const supportBtn = document.getElementById('supportBtn');
const supportDropdown = document.getElementById('supportDropdown');
supportBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  supportDropdown.classList.toggle('open');
});
document.addEventListener('click', () => supportDropdown.classList.remove('open'));
supportDropdown.addEventListener('click', (e) => e.stopPropagation());

document.getElementById('copyPixBtn').addEventListener('click', async () => {
  const key = document.getElementById('pixKey').textContent;
  const btn = document.getElementById('copyPixBtn');
  try {
    await navigator.clipboard.writeText(key);
    btn.textContent = t('copiedMsg');
  } catch (e) {
    btn.textContent = t('copyErrorMsg');
  }
  setTimeout(() => { btn.textContent = t('copyBtn'); }, 2000);
});
</script>
