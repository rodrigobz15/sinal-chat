<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2isPair — converse com um estranho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fbf9ff;
    --panel: #ffffff;
    --panel-2: #f4f0fc;
    --line: #ece5fa;
    --text: #332f45;
    --dim: #8b84a0;
    --accent-a: #8b6cf7;   /* você — roxo */
    --accent-a-soft: #ece5fd;
    --accent-b: #ff9d72;   /* estranho — pêssego */
    --accent-b-soft: #ffe9dd;
    --display: 'Fredoka', 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 20px;
  }

  body[data-theme="dark"]{
    --bg: #221f30;
    --panel: #2b2740;
    --panel-2: #332e4a;
    --line: #423b5c;
    --text: #f1eefa;
    --dim: #a79fc2;
    --accent-a-soft: #3a3355;
    --accent-b-soft: #4a3a3c;
  }

  .theme-toggle{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    width: 34px; height: 34px;
    display:flex; align-items:center; justify-content:center;
    font-size: 14px;
    cursor: pointer;
  }
  .theme-toggle:hover{ border-color: var(--accent-a); }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
  }
  .brand-mark{
    width: 28px; height: 28px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand .two{ color: var(--accent-a); }
  .brand .pair{ color: var(--accent-b); }

  .dot{
    width:9px;height:9px;border-radius:50%;
    background: var(--dim);
    transition: background .3s, box-shadow .3s;
    flex-shrink:0;
  }
  .dot.searching{ background: var(--accent-b); box-shadow: 0 0 10px var(--accent-b); animation: pulse 1.2s infinite; }
  .dot.connected{ background: #6bcf7f; box-shadow: 0 0 10px #6bcf7f; }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(1.4); }
  }

  .status-text{
    font-size: 12px;
    color: var(--dim);
    font-weight: 700;
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap: 1px;
    background: var(--line);
    min-height:0;
  }

  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
  }

  .video-stage{
    background: var(--bg);
    padding: 12px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    min-height:0;
    flex: 1;
  }

  .video-grid{
    flex: 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 10px;
    min-height:0;
  }

  .video-box{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 1;
    width: auto;
    max-width: 100%;
    aspect-ratio: 16 / 11;
    min-height: 0;
    box-shadow: 0 10px 26px -16px rgba(139,108,247,0.3);
  }

  video{
    width:100%;
    height:100%;
    object-fit: cover;
    background: #000;
  }

  .video-label{
    position:absolute;
    bottom: 10px;
    left: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .flip-btn{
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
  }
  .flip-btn:hover{ background: rgba(0,0,0,0.65); border-color: transparent; }

  .placeholder{
    color: var(--dim);
    font-size: 13px;
    font-weight: 600;
    text-align:center;
    padding: 20px;
  }

  .controls{
    display:flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .controls button{
    padding: 12px 16px;
    font-size: 13px;
    white-space: nowrap;
  }

  button{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: var(--radius);
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s, transform .1s, filter .15s;
  }
  button:hover{ border-color: var(--accent-a); }
  button:active{ transform: scale(0.97); }

  button.primary{
    background: var(--accent-a);
    color: #fff;
    border-color: var(--accent-a);
  }
  button.primary:hover{ filter: brightness(1.08); }

  button.next{
    background: var(--accent-b);
    color: #fff;
    border-color: var(--accent-b);
  }

  button:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  .chat-panel{
    background: var(--bg);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .chat-log{
    flex:1;
    overflow-y:auto;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .msg{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
  }
  .msg.me{
    align-self:flex-end;
    background: var(--accent-a);
    color: #fff;
    border: none;
  }
  .msg.stranger{
    align-self:flex-start;
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .msg.system{
    align-self:center;
    font-size: 12px;
    color: var(--dim);
    background:none;
    border:none;
    padding: 4px;
    text-align: center;
    font-weight: 700;
  }

  .bottom-bar{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  @media (max-width: 640px){
    .bottom-bar{ flex-wrap: wrap; }
  }

  .chat-input-row{
    flex:1;
    display:flex;
    gap: 10px;
    min-width: 200px;
  }

  .chat-input-row input{
    flex:1;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
  }
  .chat-input-row input:focus{ outline:none; border-color: var(--accent-a); }
  .chat-input-row input:disabled{ opacity:0.5; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  /* Modo somente texto: some só com o grid de vídeo, mantém os controles */
  body.text-mode .video-stage{ display:none; }
  body.text-mode main{ grid-template-columns: 1fr; }
  body.text-mode .chat-panel{ max-width: 720px; margin: 0 auto; width:100%; }
  body.text-mode .bottom-bar{ max-width: 720px; margin: 0 auto; width:100%; }
  body.text-mode #screenBtn{ display:none; }

  .back-link{
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
    text-decoration:none;
  }
  .back-link:hover{ color: var(--accent-a); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="16" height="16" viewBox="0 0 20 20">
        <circle cx="8" cy="10" r="5" fill="#fff" opacity="0.95"/>
        <circle cx="13" cy="10" r="5" fill="#fff" opacity="0.6"/>
      </svg>
    </div>
    <span class="dot" id="statusDot"></span>
    <span class="two">2is</span><span class="pair">Pair</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div class="status-text" id="statusText">desconectado</div>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
    <a class="back-link" href="/" id="leaveLink">← sair</a>
  </div>
</header>

<main>
  <div class="video-stage">
    <div class="video-grid">
      <div class="video-box">
        <video id="localVideo" autoplay muted playsinline></video>
        <span class="video-label">você</span>
        <button class="flip-btn" id="flipBtn" title="Trocar câmera">🔄</button>
      </div>
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="placeholder" id="remotePlaceholder">aguardando um estranho...</span>
        <span class="video-label" id="remoteLabel" style="display:none;">estranho</span>
      </div>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-log" id="chatLog"></div>
  </div>
</main>

<div class="bottom-bar">
  <div class="controls">
    <button class="primary" id="startBtn">começar</button>
    <button class="next" id="nextBtn" disabled>próximo →</button>
    <button id="screenBtn" disabled title="Compartilhar sua tela">🖥️</button>
    <button id="stopBtn" disabled>parar</button>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="diga oi..." disabled>
    <button class="primary" id="sendBtn" disabled>enviar</button>
  </div>
</div>

<script>
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const remotePlaceholder = document.getElementById('remotePlaceholder');
const remoteLabel = document.getElementById('remoteLabel');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const stopBtn = document.getElementById('stopBtn');
const screenBtn = document.getElementById('screenBtn');
const flipBtn = document.getElementById('flipBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// STUN público do Google — funciona para boa parte das conexões.
// Para produção de verdade, adicione também um servidor TURN (veja README).
// STUN/TURN dedicados (conta grátis no Metered) — bem mais confiáveis que
// servidores públicos compartilhados, essencial pra conectar entre redes
// diferentes (ex: wifi de um lado e dados móveis do outro).
const ICE_SERVERS = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turn:global.relay.metered.ca:443', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'c021dfe6c9ba7996cf4270b1', credential: 'G9rHTJo9tdA6cJHu' },
];

async function getIceServers() {
  return ICE_SERVERS;
}

let ws = null;
let pc = null;
let localStream = null;
let role = null; // 'caller' | 'callee'
let connected = false;
let searchWatchdog = null;
let currentFacingMode = 'user'; // 'user' = frontal, 'environment' = traseira
let sharingScreen = false;
let cameraTrackBackup = null;

function armSearchWatchdog() {
  clearSearchWatchdog();
  // Se ficar "procurando" por tempo demais sem conectar de verdade, tenta se
  // re-parear sozinho — evita ficar preso quando uma mensagem de pareamento
  // se perde (mais comum em redes móveis instáveis).
  searchWatchdog = setTimeout(() => {
    if (!connected && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'next' }));
      armSearchWatchdog();
    }
  }, 7000);
}

function clearSearchWatchdog() {
  if (searchWatchdog) {
    clearTimeout(searchWatchdog);
    searchWatchdog = null;
  }
}

// Manda um "ping" periódico pro servidor — evita que a conexão seja
// derrubada por inatividade (proxies costumam fechar WebSockets ociosos).
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 20000);

// Preferências vindas da landing page via querystring: ?mode=video&country=BR&interests=games,musica
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'text' ? 'text' : 'video';
const COUNTRY = params.get('country') || 'any';
const INTERESTS = (params.get('interests') || '')
  .split(',')
  .map(s => s.trim().toLowerCase())
  .filter(Boolean);

if (MODE === 'text') {
  document.body.classList.add('text-mode');
}

function setStatus(state, label) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = label;
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function start() {
  startBtn.disabled = true;

  if (MODE === 'video') {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
      localVideo.srcObject = localStream;
      screenBtn.disabled = false;
    } catch (err) {
      addMsg('não consegui acessar câmera/microfone: ' + err.message, 'system');
      startBtn.disabled = false;
      return;
    }
  }

  connectSocket();
  stopBtn.disabled = false;
}

function connectSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setStatus('searching', 'procurando estranho...');
    nextBtn.disabled = false;
    ws.send(JSON.stringify({ type: 'join', mode: MODE, country: COUNTRY, interests: INTERESTS }));
  };

  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);

    switch (data.type) {
      case 'waiting':
        setStatus('searching', 'procurando estranho...');
        armSearchWatchdog();
        break;

      case 'matched':
        clearSearchWatchdog();
        // Garante um estado limpo mesmo se alguma mensagem anterior (tipo
        // 'partner-left') tiver se perdido no caminho.
        teardownPeer();
        role = data.role;
        setStatus('connected', 'conectado');
        connected = true;
        nextBtn.disabled = false;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        remotePlaceholder.style.display = 'none';
        remoteLabel.style.display = 'block';
        if (data.shared && data.shared.length) {
          addMsg(`você foi conectado a um estranho. em comum: ${data.shared.join(', ')}`, 'system');
        } else {
          addMsg('você foi conectado a um estranho. diga oi!', 'system');
        }
        if (MODE === 'video') {
          await setupPeerConnection();
          if (role === 'caller') {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
          }
        }
        break;

      case 'offer':
        if (!pc) await setupPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: data.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        break;

      case 'answer':
        await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
        break;

      case 'candidate':
        if (data.candidate) {
          try { await pc.addIceCandidate(data.candidate); } catch (e) {}
        }
        break;

      case 'chat':
        addMsg(data.text, 'stranger');
        break;

      case 'partner-left':
        addMsg('o estranho saiu da conversa.', 'system');
        teardownPeer();
        setStatus('searching', 'procurando outro estranho...');
        armSearchWatchdog();
        break;
    }
  };

  ws.onclose = () => {
    if (connected || startBtn.disabled) {
      setStatus('', 'desconectado');
    }
  };
}

async function setupPeerConnection() {
  const iceServers = await getIceServers();
  pc = new RTCPeerConnection({ iceServers });

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    console.log('ICE state:', state);
    if (state === 'checking') {
      addMsg('conectando o vídeo...', 'system');
    } else if (state === 'connected' || state === 'completed') {
      // silencioso, já dá pra ver o vídeo aparecendo
    } else if (state === 'failed') {
      addMsg('não consegui conectar o vídeo com esse estranho (rede muito restrita). tenta "próximo".', 'system');
    } else if (state === 'disconnected') {
      addMsg('conexão de vídeo instável...', 'system');
    }
  };
}

function teardownPeer() {
  if (pc) {
    pc.close();
    pc = null;
  }
  remoteVideo.srcObject = null;
  remotePlaceholder.style.display = 'block';
  remoteLabel.style.display = 'none';
  connected = false;
  // nextBtn fica de propósito habilitado — é a forma manual de "procurar
  // outra pessoa" caso o re-pareamento automático demore.
  chatInput.disabled = true;
  sendBtn.disabled = true;
}

function next() {
  teardownPeer();
  if (sharingScreen) {
    sharingScreen = false;
    screenBtn.textContent = '🖥️';
    localVideo.srcObject = localStream;
  }
  chatLog.innerHTML = '';
  setStatus('searching', 'procurando outro estranho...');
  ws.send(JSON.stringify({ type: 'next' }));
}

function stop() {
  clearSearchWatchdog();
  teardownPeer();
  if (ws) ws.close();
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localVideo.srcObject = null;
  }
  sharingScreen = false;
  cameraTrackBackup = null;
  screenBtn.disabled = true;
  screenBtn.textContent = '🖥️';
  setStatus('', 'desconectado');
  startBtn.disabled = false;
  stopBtn.disabled = true;
  nextBtn.disabled = true;
  chatLog.innerHTML = '';
}

async function flipCamera() {
  if (!localStream) return;
  const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: nextFacing }, audio: false });
    const newTrack = newStream.getVideoTracks()[0];

    // Troca a faixa de vídeo que está sendo enviada pro parceiro, se já conectado
    if (pc) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) await sender.replaceTrack(newTrack);
    }

    // Troca a faixa antiga pela nova no stream local e atualiza a prévia
    const oldTrack = localStream.getVideoTracks()[0];
    if (oldTrack) {
      localStream.removeTrack(oldTrack);
      oldTrack.stop();
    }
    localStream.addTrack(newTrack);
    localVideo.srcObject = localStream;
    currentFacingMode = nextFacing;
  } catch (err) {
    addMsg('não consegui trocar de câmera: ' + err.message, 'system');
  }
}

async function toggleScreenShare() {
  if (!sharingScreen) {
    try {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      cameraTrackBackup = localStream ? localStream.getVideoTracks()[0] : null;

      if (pc) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) await sender.replaceTrack(screenTrack);
      }
      localVideo.srcObject = screenStream;
      sharingScreen = true;
      screenBtn.textContent = '🖥️ ✕';
      // Se a pessoa parar de compartilhar pelo controle nativo do navegador
      screenTrack.onended = () => stopScreenShare();
    } catch (err) {
      // Usuário cancelou o seletor de tela — não é um erro de verdade
    }
  } else {
    stopScreenShare();
  }
}

async function stopScreenShare() {
  if (!sharingScreen) return;
  if (cameraTrackBackup && pc) {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(cameraTrackBackup);
  }
  localVideo.srcObject = localStream;
  sharingScreen = false;
  screenBtn.textContent = '🖥️';
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !connected) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  addMsg(text, 'me');
  chatInput.value = '';
}

startBtn.onclick = start;
nextBtn.onclick = next;
stopBtn.onclick = stop;
sendBtn.onclick = sendChat;
flipBtn.onclick = flipCamera;
screenBtn.onclick = toggleScreenShare;

document.getElementById('leaveLink').addEventListener('click', (e) => {
  e.preventDefault();
  stop(); // avisa o parceiro (via fechamento do WS) e limpa tudo antes de sair
  setTimeout(() => { location.href = '/'; }, 150);
});

// Tema claro/escuro — claro é o padrão agora
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'light' ? '🌙' : '☀️';
}
applyTheme(localStorage.getItem('theme') || 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', next);
  applyTheme(next);
});
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});
</script>
</body>
</html>
